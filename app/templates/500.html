{% extends "base.html" %}
{% block title %}Server Error — EmployeeHub{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">{% endblock %}

{% block body %}
<div class="error-page">
    <div class="error-content">
        <div class="error-icon error-500"><i class="bi bi-gear"></i></div>
        <h1>500</h1>
        <h2>Server Error</h2>
        <p>Something went wrong on our end. Please try again later.</p>
        <div class="error-actions">
            <a href="{{ url_for('auth.landing') }}" class="btn btn-primary-custom"><i class="bi bi-house"></i> Go Home</a>
            <a href="javascript:location.reload()" class="btn btn-secondary-custom"><i class="bi bi-arrow-clockwise"></i> Retry</a>
        </div>
    </div>
</div>
{% endblock %}
