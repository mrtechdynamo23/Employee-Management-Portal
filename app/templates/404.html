{% extends "base.html" %}
{% block title %}Page Not Found — EmployeeHub{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">{% endblock %}

{% block body %}
<div class="error-page">
    <div class="error-content">
        <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <div class="error-actions">
            <a href="{{ url_for('auth.landing') }}" class="btn btn-primary-custom"><i class="bi bi-house"></i> Go Home</a>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary-custom"><i class="bi bi-speedometer2"></i> Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
